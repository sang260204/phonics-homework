<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파닉스 키즈 플레이랜드</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Jua', sans-serif; }
    body { background-color: #fce4ec; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .container { width: 100%; max-width: 480px; background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 25px rgba(233, 30, 99, 0.15); border: 4px solid #f8bbd0; }
    
    /* 모달 */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border: 3px solid #ff4081; }
    .modal-content h2 { color: #e91e63; margin-bottom: 15px; }
    .modal-content input, .modal-content select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #f8bbd0; border-radius: 10px; font-size: 16px; outline: none; }
    .btn-start { width: 100%; padding: 12px; background: #e91e63; color: white; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; margin-top: 10px; font-weight: bold; }

    /* 상단 유저 정보바 */
    .user-info-bar { display: flex; align-items: center; justify-content: space-between; background: #fff0f5; border: 2px solid #f8bbd0; border-radius: 18px; padding: 10px 15px; margin-bottom: 15px; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-avatar { font-size: 28px; background: white; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #f8bbd0; }
    .user-details .grade { font-size: 11px; color: #e91e63; font-weight: bold; }
    .user-details .name { font-size: 16px; color: #333; font-weight: bold; }
    .score-badge { background: white; border: 2px solid #ffe082; padding: 5px 12px; border-radius: 15px; font-size: 14px; color: #ffa000; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .change-btn { background: #e91e63; color: white; border: none; padding: 6px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; }

    /* 유닛 선택 */
    .nav-units { display: flex; justify-content: space-between; margin-bottom: 12px; gap: 6px; }
    .unit-btn { flex: 1; padding: 10px 0; border: none; border-radius: 15px; background: #fff0f5; color: #888; font-size: 14px; cursor: pointer; border: 2px solid #f8bbd0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .unit-btn span { font-size: 16px; font-weight: bold; }
    .unit-btn.active { background: #e91e63; color: white; border-color: #e91e63; }
    .unit-btn.active span { color: white; }

    /* 학습 모드 선택 */
    .nav-modes { display: flex; justify-content: space-between; margin-bottom: 15px; background: #fff0f5; padding: 6px; border-radius: 18px; border: 2px solid #f8bbd0; gap: 4px; }
    .mode-btn { flex: 1; padding: 8px 0; border: none; border-radius: 12px; background: transparent; color: #666; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .mode-btn span { font-size: 13px; font-weight: bold; }
    .mode-btn.active { background: white; color: #e91e63; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    /* 디스플레이 영역 */
    .title-banner { text-align: center; color: #e91e63; font-size: 15px; margin-bottom: 10px; font-weight: bold; }
    .main-display { background: #fffde7; border: 3px solid #fff59d; border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 15px; min-height: 170px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .display_emoji_box { font-size: 55px; margin-bottom: 5px; background: white; width: 85px; height: 85px; display: flex; align-items: center; justify-content: center; border-radius: 20px; border: 2px solid #ffe082; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .display-word { font-size: 30px; color: #d81b60; margin-bottom: 3px; letter-spacing: 2px; font-weight: bold; }
    .display-meaning { font-size: 16px; color: #666; font-weight: bold; }

    /* 카드 그리드 및 기타 요소 */
    .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .card-item { background: white; border: 2px solid #e0e0e0; border-radius: 15px; padding: 10px 5px; text-align: center; cursor: pointer; }
    .card-item.selected { border-color: #ff4081; background: #fff0f5; box-shadow: 0 0 8px rgba(255,64,129,0.3); }
    .card-emoji { font-size: 28px; }
    .card-word { font-size: 13px; color: #333; margin-top: 3px; font-weight: bold; }

    .blend-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 230px; overflow-y: auto; padding-right: 2px; }
    .blend-btn { padding: 10px 5px; background: #f3e5f5; border: 2px solid #ce93d8; border-radius: 12px; font-size: 14px; color: #4a148c; cursor: pointer; text-align: center; font-weight: bold; }
    
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; margin-top: 5px; }
    .opt-btn { padding: 10px; background: #e8eaf6; border: 2px solid #c5cae9; border-radius: 12px; font-size: 16px; color: #1a237e; cursor: pointer; font-weight: bold; }

    .speaker-btn { background: #ff4081; color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; font-weight: bold; }
    
    /* 짝맞추기 게임용 스타일 */
    .match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .match-card { background: #e3f2fd; border: 2px solid #90caf9; border-radius: 12px; padding: 12px 5px; text-align: center; font-size: 15px; cursor: pointer; min-height: 55px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0d47a1; }
    .match-card.matched { background: #c8e6c9; border-color: #81c784; opacity: 0.5; cursor: default; color: #2e7d32; }
    .match-card.selected { border-color: #ff4081; background: #fff0f5; }

    /* 스펠링 게임용 스타일 */
    .spell-input { width: 100%; padding: 12px; border: 2px solid #ff80ab; border-radius: 12px; font-size: 18px; text-align: center; margin-bottom: 8px; outline: none; font-weight: bold; color: #333; }
    .spell-submit { width: 100%; padding: 10px; background: #ff4081; color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<!-- 사용자 등록 모달 -->
<div id="userModal" class="modal">
  <div class="modal-content">
    <h2>🎈 파닉스 키즈 플레이랜드</h2>
    <p style="color:#666; margin-bottom:10px; font-size:14px;">학생 정보를 입력해 주세요!</p>
    <input type="text" id="userName" placeholder="어린이 이름 (예: 이상식)">
    <select id="userGrade">
      <option value="초등 3학년 이상">초등 3학년 이상</option>
      <option value="초등 1-2학년">초등 1-2학년</option>
      <option value="유치부">유치부</option>
    </select>
    <button class="btn-start" onclick="saveUser()">학습 시작하기 🚀</button>
  </div>
</div>

<div class="container">
  <!-- 상단 유저 정보바 -->
  <div class="user-info-bar">
    <div class="user-profile">
      <div class="user-avatar" id="userAvatar">👧</div>
      <div class="user-details">
        <div class="grade" id="displayGrade">초등 3학년 이상</div>
        <div class="name" id="displayName">이상식</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="score-badge">⭐ <span id="totalScore">0</span>점</div>
      <button class="change-btn" onclick="openModal()">변경</button>
    </div>
  </div>

  <!-- 유닛 선택 -->
  <div class="nav-units">
    <button class="unit-btn active" onclick="switchUnit('u1')">
      <span>🐱 U1</span>
    </button>
    <button class="unit-btn" onclick="switchUnit('u2')">
      <span>🐸 U2</span>
    </button>
    <button class="unit-btn" onclick="switchUnit('u3')">
      <span>🦝 U3</span>
    </button>
    <button class="unit-btn" onclick="switchUnit('u4')">
      <span>🦈 U4</span>
    </button>
  </div>

  <!-- 학습 모드 선택 -->
  <div class="nav-modes">
    <button class="mode-btn active" onclick="switchMode('listen')">
      <span>🎧</span>듣기
    </button>
    <button class="mode-btn" onclick="switchMode('blend')">
      <span>🧩</span>조합
    </button>
    <button class="mode-btn" onclick="switchMode('match')">
      <span>🃏</span>짝맞추기
    </button>
    <button class="mode-btn" onclick="switchMode('spell')">
      <span>✏️</span>스펠링
    </button>
    <button class="mode-btn" onclick="switchMode('blank')">
      <span>🔍</span>빈칸
    </button>
  </div>

  <div class="title-banner" id="modeTitle">Unit 1: L-Blends • 그림 카드를 눌러보세요</div>

  <!-- 메인 학습 영역 -->
  <div class="main-display" id="mainDisplay"></div>

  <!-- 하단 제어/선택 영역 -->
  <div id="bottomContent"></div>
</div>

<script>
// 구글 앱스 스크립트 웹앱 URL 연동 완료
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4LDDETD6E2gS8jxFHecFslZL2EQ6bco4rvxdPUPhasPhdtA_dSBpaUG6my5BZZpMM/exec";

let studentName = "이상식";
let studentGrade = "초등 3학년 이상";
let userScore = 0;
let currentUnit = "u1";
let currentMode = "listen";
let selectedWordIndex = 0;

let matchSelected = null;
let matchedCount = 0;

// 파닉스 음가 변환 맵
const phonicsMap = {
  "fl": "플르", "fr": "프르", "gl": "글르", "cl": "클르", "pl": "플르", "sl": "슬르", "bl": "블르",
  "cr": "크르", "dr": "드르", "gr": "그르", "tr": "트르", "br": "브르",
  "sk": "스크", "sm": "스므", "sn": "스느", "sp": "스프", "st": "스트", "sw": "스워",
  "sh": "쉬", "ck": "크", "ng": "응", "ch": "치", "th": "쓰"
};

// 원본 단어 데이터 세트 (블랙, 블록 등 원본 그대로)
const unitsData = {
  u1: {
    title: "Unit 1: L-Blends",
    words: [
      { word: "black", target: "bl", meaning: "검정색", emoji: "⬛" },
      { word: "block", target: "bl", meaning: "블록", emoji: "🧱" },
      { word: "blue", target: "bl", meaning: "파란색", emoji: "🟦" },
      { word: "clap", target: "cl", meaning: "박수치다", emoji: "👏" },
      { word: "clock", target: "cl", meaning: "시계", emoji: "⏰" },
      { word: "flag", target: "fl", meaning: "깃발", emoji: "🏁" },
      { word: "glass", target: "gl", meaning: "유리컵", emoji: "🥛" },
      { word: "plane", target: "pl", meaning: "비행기", emoji: "✈️" },
      { word: "slide", target: "sl", meaning: "미끄럼틀", emoji: "🛝" }
    ]
  },
  u2: {
    title: "Unit 2: R-Blends",
    words: [
      { word: "crab", target: "cr", meaning: "게", emoji: "🦀" },
      { word: "crown", target: "cr", meaning: "왕관", emoji: "👑" },
      { word: "drum", target: "dr", meaning: "드럼", emoji: "🥁" },
      { word: "dress", target: "dr", meaning: "드레스", emoji: "👗" },
      { word: "frog", target: "fr", meaning: "개구리", emoji: "🐸" },
      { word: "frame", target: "fr", meaning: "액자", emoji: "🖼️" },
      { word: "grape", target: "gr", meaning: "포도", emoji: "🍇" },
      { word: "grass", target: "gr", meaning: "잔디", emoji: "🌿" },
      { word: "tree", target: "tr", meaning: "나무", emoji: "🌳" }
    ]
  },
  u3: {
    title: "Unit 3: S-Blends",
    words: [
      { word: "skate", target: "sk", meaning: "스케이트", emoji: "⛸️" },
      { word: "skirt", target: "sk", meaning: "치마", emoji: "👗" },
      { word: "smile", target: "sm", meaning: "미소", emoji: "😊" },
      { word: "smoke", target: "sm", meaning: "연기", emoji: "🌫️" },
      { word: "snake", target: "sn", meaning: "뱀", emoji: "🐍" },
      { word: "snow", target: "sn", meaning: "눈", emoji: "❄️" },
      { word: "spoon", target: "sp", meaning: "숟가락", emoji: "🥄" },
      { word: "spider", target: "sp", meaning: "거미", emoji: "🕷️" },
      { word: "star", target: "st", meaning: "별", emoji: "⭐" }
    ]
  },
  u4: {
    title: "Unit 4: Digraphs",
    words: [
      { word: "ship", target: "sh", meaning: "배", emoji: "🚢" },
      { word: "fish", target: "sh", meaning: "물고기", emoji: "🐟" },
      { word: "duck", target: "ck", meaning: "오리", emoji: "🦆" },
      { word: "ring", target: "ng", meaning: "반지", emoji: "💍" },
      { word: "sing", target: "ng", meaning: "노래", emoji: "🎤" },
      { word: "king", target: "ng", meaning: "왕", emoji: "👑" },
      { word: "bench", target: "ch", meaning: "벤치", emoji: "🪑" },
      { word: "beach", target: "ch", meaning: "해변", emoji: "🏖️" },
      { word: "thin", target: "th", meaning: "마른", emoji: "🧍" }
    ]
  }
};

function openModal() {
  document.getElementById("userModal").style.display = "flex";
}

function saveUser() {
  const nameInput = document.getElementById("userName").value.trim();
  if(!nameInput) { alert("이름을 입력해 주세요!"); return; }
  studentName = nameInput;
  studentGrade = document.getElementById("userGrade").value;
  
  document.getElementById("displayName").textContent = studentName;
  document.getElementById("displayGrade").textContent = studentGrade;
  document.getElementById("userModal").style.display = "none";
  renderUI();
}

function switchUnit(u) {
  currentUnit = u;
  selectedWordIndex = 0;
  matchSelected = null;
  matchedCount = 0;
  window.matchCards = null;
  document.querySelectorAll('.unit-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', `u${idx+1}` === u);
  });
  renderUI();
}

function switchMode(m) {
  currentMode = m;
  selectedWordIndex = 0;
  matchSelected = null;
  matchedCount = 0;
  window.matchCards = null;
  const modes = ['listen', 'blend', 'match', 'spell', 'blank'];
  document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', modes[idx] === m);
  });
  renderUI();
}

function renderUI() {
  const words = unitsData[currentUnit].words;
  const currentObj = words[selectedWordIndex];
  
  let modeDesc = "";
  if(currentMode === "listen") modeDesc = "그림 카드를 눌러보세요";
  else if(currentMode === "blend") modeDesc = "파닉스 조합을 확인해보세요";
  else if(currentMode === "match") modeDesc = "그림과 단어를 짝지어 보세요";
  else if(currentMode === "spell") modeDesc = "소리를 듣고 단어를 입력하세요";
  else if(currentMode === "blank") modeDesc = "빈칸에 들어갈 글자를 고르세요";

  document.getElementById("modeTitle").textContent = `${unitsData[currentUnit].title} • ${modeDesc}`;
  
  const mainDisplay = document.getElementById("mainDisplay");
  const bottomContent = document.getElementById("bottomContent");

  // 1. 듣기 모드
  if(currentMode === "listen") {
    mainDisplay.innerHTML = `
      <div class="display_emoji_box">${currentObj.emoji}</div>
      <div class="display-word">${currentObj.word}</div>
      <div class="display-meaning">"${currentObj.meaning}"</div>
      <button class="speaker-btn" onclick="speak('${currentObj.word}')">🔊 소리 듣기</button>
    `;
    
    let html = `<div class="card-grid">`;
    words.forEach((item, idx) => {
      html += `
        <div class="card-item ${idx === selectedWordIndex ? 'selected':''}" onclick="selectListenCard(${idx})">
          <div class="card-emoji">${item.emoji}</div>
          <div class="card-word">${item.word}</div>
        </div>
      `;
    });
    html += `</div>`;
    bottomContent.innerHTML = html;
  } 
  // 2. 조합 모드
  else if(currentMode === "blend") {
    mainDisplay.innerHTML = `
      <div class="display_emoji_box">${currentObj.emoji}</div>
      <div class="display-word">${currentObj.word}</div>
      <div class="display-meaning">"${currentObj.meaning}"</div>
      <button class="speaker-btn" onclick="playPhonicsBlend('${currentObj.target}', '${currentObj.word}')">🔊 파닉스 조합 듣기</button>
    `;
    
    let html = `<div class="blend-list">`;
    words.forEach((item, idx) => {
      html += `
        <button class="blend-btn" onclick="selectBlendWord(${idx})">
          ${item.emoji} ${item.word}
        </button>
      `;
    });
    html += `</div>`;
    bottomContent.innerHTML = html;
  }
  // 3. 짝맞추기 모드
  else if(currentMode === "match") {
    mainDisplay.innerHTML = `
      <div style="font-size:16px; color:#e91e63; font-weight:bold;">🧩 그림 카드와 단어 카드를 번갈아 눌러 짝을 맞추세요!</div>
    `;
    
    if(!window.matchCards || window.matchCardsUnit !== currentUnit) {
      window.matchCardsUnit = currentUnit;
      let list = [];
      words.forEach((item, i) => {
        list.push({ type: 'emoji', val: item.emoji, id: i });
        list.push({ type: 'word', val: item.word, id: i });
      });
      window.matchCards = list.sort(() => Math.random() - 0.5);
    }

    let html = `<div class="match-grid">`;
    window.matchCards.forEach((c, idx) => {
      let isMatched = c.matched ? 'matched' : '';
      let isSelected = matchSelected === idx ? 'selected' : '';
      html += `
        <div class="match-card ${isMatched} ${isSelected}" onclick="handleMatchClick(${idx})">
          ${c.val}
        </div>
      `;
    });
    html += `</div>`;
    bottomContent.innerHTML = html;
  }
  // 4. 스펠링 모드
  else if(currentMode === "spell") {
    mainDisplay.innerHTML = `
      <div class="display_emoji_box">${currentObj.emoji}</div>
      <div class="display-meaning">"${currentObj.meaning}"</div>
      <button class="speaker-btn" onclick="speak('${currentObj.word}')">🔊 소리 듣고 단어 쓰기</button>
    `;
    
    bottomContent.innerHTML = `
      <input type="text" id="spellInput" class="spell-input" placeholder="정답을 영어로 입력하세요" autofocus>
      <button class="spell-submit" onclick="checkSpellAnswer()">확인 🚀</button>
    `;
  }
  // 5. 빈칸 모드
  else if(currentMode === "blank") {
    const blankWord = currentObj.word.replace(currentObj.target, "__");
    mainDisplay.innerHTML = `
      <div class="display_emoji_box">${currentObj.emoji}</div>
      <div class="display-word">${blankWord}</div>
      <div class="display-meaning">"${currentObj.meaning}"</div>
    `;

    const targets = Array.from(new Set(words.map(w => w.target)));
    let html = `<div class="options-grid">`;
    targets.forEach(t => {
      html += `<button class="opt-btn" onclick="checkBlankAnswer('${t}', '${currentObj.target}')">${t}</button>`;
    });
    html += `</div>`;
    bottomContent.innerHTML = html;
  }
}

// 상호작용 및 점수 반영 로직
function addScore(points) {
  userScore += points;
  document.getElementById("totalScore").textContent = userScore;
}

function selectListenCard(idx) {
  selectedWordIndex = idx;
  renderUI();
  speak(unitsData[currentUnit].words[idx].word);
  addScore(10);
  sendResultToGoogleSheets("듣기 활동", 10);
}

function selectBlendWord(idx) {
  selectedWordIndex = idx;
  renderUI();
  const obj = unitsData[currentUnit].words[idx];
  playPhonicsBlend(obj.target, obj.word);
  addScore(10);
  sendResultToGoogleSheets("조합 활동", 10);
}

function playPhonicsBlend(target, word) {
  const koreanSound = phonicsMap[target] || target;
  speak(koreanSound, 'ko-KR', () => {
    setTimeout(() => {
      speak(word, 'en-US');
    }, 400);
  });
}

function handleMatchClick(idx) {
  let cards = window.matchCards;
  if(cards[idx].matched) return;

  if(matchSelected === null) {
    matchSelected = idx;
    if(cards[idx].type === 'word') speak(cards[idx].val);
    renderUI();
  } else if(matchSelected === idx) {
    matchSelected = null;
    renderUI();
  } else {
    let first = cards[matchSelected];
    let second = cards[idx];

    if(first.id === second.id && first.type !== second.type) {
      first.matched = true;
      second.matched = true;
      speak("Good job!", 'en-US');
      matchedCount += 2;
      addScore(10);
      sendResultToGoogleSheets("짝맞추기 게임", 10);
      if(matchedCount === cards.length) {
        setTimeout(() => alert("모든 짝을 맞추셨습니다! 🎉"), 300);
      }
    } else {
      speak("Try again", 'en-US');
    }
    matchSelected = null;
    renderUI();
  }
}

function checkSpellAnswer() {
  const input = document.getElementById("spellInput").value.trim().toLowerCase();
  const correct = unitsData[currentUnit].words[selectedWordIndex].word.toLowerCase();

  if(input === correct) {
    speak("Awesome!", 'en-US');
    addScore(20);
    sendResultToGoogleSheets("스펠링 게임", 20);
    alert("정답입니다! 🎉");
    selectedWordIndex = (selectedWordIndex + 1) % unitsData[currentUnit].words.length;
    renderUI();
  } else {
    speak("Try again", 'en-US');
    alert("다시 써보세요! 😃");
  }
}

function checkBlankAnswer(selected, correct) {
  if(selected === correct) {
    speak("Good job!", 'en-US');
    addScore(15);
    sendResultToGoogleSheets("빈칸 채우기", 15);
    alert("정답입니다! 🎉");
    selectedWordIndex = (selectedWordIndex + 1) % unitsData[currentUnit].words.length;
    renderUI();
  } else {
    speak("Try again", 'en-US');
    alert("다시 시도해보세요! 😃");
  }
}

function speak(text, lang = 'en-US', callback = null) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = 0.8;
    if(callback) utterance.onend = callback;
    window.speechSynthesis.speak(utterance);
  }
}

// 구글 시트 연동 전송 함수
function sendResultToGoogleSheets(activityName, score) {
  if(!GOOGLE_SCRIPT_URL) return;

  const payload = {
    grade: studentGrade,
    name: studentName,
    unit: unitsData[currentUnit].title,
    activity: activityName,
    score: score
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(e => console.log("전송 오류:", e));
}
