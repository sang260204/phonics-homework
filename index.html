<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파닉스 키즈 플레이랜드 🎈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Jua', 'Nunito', sans-serif; touch-action: manipulation; }
    body {
      background-color: #FFF5F8;
      background-image: radial-gradient(#FFC2D1 2px, transparent 2px);
      background-size: 24px 24px;
    }
  </style>
  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4LDDETD6E2gS8jxFHecFslZL2EQ6bco4rvxdPUPhasPhdtA_dSBpaUG6my5BZZpMM/exec";
  </script>
</head>
<body class="min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const UNITS = [
      {
        id: 'u1',
        title: 'Unit 1: L-Blends',
        icon: '🐱',
        sounds: ['bl', 'cl', 'fl', 'gl', 'pl', 'sl'],
        words: [
          { word: 'black', meaning: '검정색', icon: '⬛', sound: 'bl' },
          { word: 'block', meaning: '블록', icon: '🧱', sound: 'bl' },
          { word: 'blue', meaning: '파란색', icon: '🟦', sound: 'bl' },
          { word: 'clap', meaning: '박수', icon: '👏', sound: 'cl' },
          { word: 'clock', meaning: '시계', icon: '⏰', sound: 'cl' },
          { word: 'flag', meaning: '깃발', icon: '🏁', sound: 'fl' },
          { word: 'glass', meaning: '유리컵', icon: '🥛', sound: 'gl' },
          { word: 'plane', meaning: '비행기', icon: '✈️', sound: 'pl' },
          { word: 'slide', meaning: '미끄럼틀', icon: '🛝', sound: 'sl' },
        ]
      },
      {
        id: 'u2',
        title: 'Unit 2: R-Blends',
        icon: '🐸',
        sounds: ['br', 'fr', 'gr', 'tr', 'dr', 'cr'],
        words: [
          { word: 'bread', meaning: '빵', icon: '🍞', sound: 'br' },
          { word: 'brown', meaning: '갈색', icon: '🟫', sound: 'br' },
          { word: 'frog', meaning: '개구리', icon: '🐸', sound: 'fr' },
          { word: 'grape', meaning: '포도', icon: '🍇', sound: 'gr' },
          { word: 'green', meaning: '초록색', icon: '🟩', sound: 'gr' },
          { word: 'tree', meaning: '나무', icon: '🌳', sound: 'tr' },
          { word: 'truck', meaning: '트럭', icon: '🚚', sound: 'tr' },
          { word: 'drum', meaning: '드럼', icon: '🥁', sound: 'dr' },
          { word: 'crab', meaning: '게', icon: '🦀', sound: 'cr' },
        ]
      },
      {
        id: 'u3',
        title: 'Unit 3: S-Blends',
        icon: '🐊',
        sounds: ['st', 'sn', 'sp', 'sm', 'sw', 'sk'],
        words: [
          { word: 'star', meaning: '별', icon: '⭐', sound: 'st' },
          { word: 'stop', meaning: '정지', icon: '🛑', sound: 'st' },
          { word: 'snake', meaning: '뱀', icon: '🐍', sound: 'sn' },
          { word: 'snow', meaning: '눈', icon: '❄️', sound: 'sn' },
          { word: 'spoon', meaning: '숟가락', icon: '🥄', sound: 'sp' },
          { word: 'smile', meaning: '미소', icon: '😊', sound: 'sm' },
          { word: 'swim', meaning: '수영', icon: '🏊', sound: 'sw' },
          { word: 'skate', meaning: '스케이트', icon: '⛸️', sound: 'sk' },
          { word: 'sky', meaning: '하늘', icon: '🌤️', sound: 'sk' },
        ]
      },
      {
        id: 'u4',
        title: 'Unit 4: Digraphs',
        icon: '🦈',
        sounds: ['sh', 'ck', 'ng', 'ch', 'th'],
        words: [
          { word: 'ship', meaning: '배', icon: '🚢', sound: 'sh' },
          { word: 'fish', meaning: '물고기', icon: '🐟', sound: 'sh' },
          { word: 'duck', meaning: '오리', icon: '🦆', sound: 'ck' },
          { word: 'ring', meaning: '반지', icon: '💍', sound: 'ng' },
          { word: 'sing', meaning: '노래', icon: '🎤', sound: 'ng' },
          { word: 'king', meaning: '왕', icon: '👑', sound: 'ng' },
          { word: 'bench', meaning: '벤치', icon: '🪑', sound: 'ch' },
          { word: 'beach', meaning: '해변', icon: '🏖️', sound: 'ch' },
          { word: 'thin', meaning: '날씬한', icon: '🧍', sound: 'th' },
        ]
      }
    ];

    function App() {
      const [studentName, setStudentName] = useState('');
      const [grade, setGrade] = useState('초등 3학년 이상');
      const [isRegistered, setIsRegistered] = useState(false);
      const [currentUnit, setCurrentUnit] = useState(0);
      const [currentMode, setCurrentMode] = useState('listen');
      const [score, setScore] = useState(0);

      // Quiz States
      const [selectedWord, setSelectedWord] = useState(null);
      const [quizIndex, setQuizIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState('');
      const [feedback, setFeedback] = useState('');

      // Blank Quiz State
      const [blankInfo, setBlankInfo] = useState({ targetIndex: 2, options: [] });

      // Card Match Game States
      const [cards, setCards] = useState([]);
      const [flipped, setFlipped] = useState([]);
      const [matched, setMatched] = useState([]);

      const audioCtxRef = useRef(null);
      const activeUnitObj = UNITS[currentUnit];

      // Web Audio API를 활용한 모바일 호환 100% 비프음/재생음
      const playBeep = (freq = 440, type = 'sine', duration = 0.2) => {
        try {
          if (!audioCtxRef.current) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtxRef.current = new AudioContext();
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }
          const osc = audioCtxRef.current.createOscillator();
          const gain = audioCtxRef.current.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtxRef.current.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtxRef.current.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtxRef.current.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtxRef.current.destination);
          osc.start();
          osc.stop(audioCtxRef.current.currentTime + duration);
        } catch(e) {}
      };

      // 모바일 친화적 음성 출력 (SpeechSynthesis + WebAudio Fallback)
      const playSound = (text) => {
        // 음성 시작 소리 활성화
        playBeep(523.25, 'sine', 0.15); // C5 도 음계

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;

          const voices = window.speechSynthesis.getVoices();
          const enVoice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en'));
          if (enVoice) utterance.voice = enVoice;

          window.speechSynthesis.speak(utterance);
        }
      };

      // 빈칸 문제 생성기 (모음 및 기타 스펠링 랜덤 빈칸)
      const setupBlankQuiz = (wordObj) => {
        const w = wordObj.word;
        // 빈칸으로 만들 위치 선택 (최소 2번째 글자 이상, 모음 우선)
        let idx = 2;
        const vowels = ['a', 'e', 'i', 'o', 'u'];
        for (let i = 2; i < w.length; i++) {
          if (vowels.includes(w[i])) {
            idx = i;
            break;
          }
        }
        const targetChar = w[idx];

        // 보기 4개 생성
        let pool = ['a', 'e', 'i', 'o', 'u', 'k', 'g', 't', 'p', 's', 'l', 'r', 'n'];
        pool = pool.filter(c => c !== targetChar);
        pool.sort(() => Math.random() - 0.5);
        const options = [targetChar, ...pool.slice(0, 3)].sort(() => Math.random() - 0.5);

        setBlankInfo({ targetIndex: idx, options: options });
      };

      // 카드 게임 초기화
      const initMatchGame = () => {
        const selectedWords = activeUnitObj.words.slice(0, 4);
        let gameCards = [];
        selectedWords.forEach((w, index) => {
          gameCards.push({ id: index * 2, wordId: index, type: 'icon', val: w.icon, word: w.word });
          gameCards.push({ id: index * 2 + 1, wordId: index, type: 'text', val: w.word, word: w.word });
        });
        gameCards.sort(() => Math.random() - 0.5);
        setCards(gameCards);
        setFlipped([]);
        setMatched([]);
      };

      useEffect(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.getVoices();
        }
      }, []);

      useEffect(() => {
        if (activeUnitObj) {
          setSelectedWord(activeUnitObj.words[0]);
          setQuizIndex(0);
          setFeedback('');
          setUserAnswer('');
          setupBlankQuiz(activeUnitObj.words[0]);
          if (currentMode === 'match') {
            initMatchGame();
          }
        }
      }, [currentUnit, currentMode]);

      useEffect(() => {
        if (activeUnitObj && activeUnitObj.words[quizIndex]) {
          setupBlankQuiz(activeUnitObj.words[quizIndex]);
        }
      }, [quizIndex]);

      const sendResultToGoogleSheet = (unitTitle, modeTitle, addScore) => {
        if (!GOOGLE_SCRIPT_URL) return;
        const payload = {
          timestamp: new Date().toLocaleString('ko-KR'),
          grade: grade,
          studentName: studentName,
          unit: unitTitle,
          activity: modeTitle,
          score: addScore
        };

        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(err => console.error(err));
      };

      const addScorePoints = (points, modeName) => {
        const newScore = score + points;
        setScore(newScore);
        playBeep(659.25, 'triangle', 0.2); // 미
        setTimeout(() => playBeep(880, 'triangle', 0.3), 100); // 라 (성공 소리)
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        sendResultToGoogleSheet(activeUnitObj.title, modeName, points);
      };

      const handleNextQuiz = () => {
        setFeedback('');
        setUserAnswer('');
        if (quizIndex + 1 < activeUnitObj.words.length) {
          setQuizIndex(quizIndex + 1);
        } else {
          setQuizIndex(0);
        }
      };

      const handleCardClick = (index) => {
        if (flipped.length === 2 || flipped.includes(index) || matched.includes(index)) return;

        const newFlipped = [...flipped, index];
        setFlipped(newFlipped);
        playSound(cards[index].word);

        if (newFlipped.length === 2) {
          const card1 = cards[newFlipped[0]];
          const card2 = cards[newFlipped[1]];

          if (card1.wordId === card2.wordId) {
            setMatched((prev) => [...prev, newFlipped[0], newFlipped[1]]);
            setFlipped([]);
            addScorePoints(10, '짝맞추기 게임');
            if (matched.length + 2 === 8) {
              setFeedback('🎉 모든 짝을 맞췄습니다!');
            }
          } else {
            playBeep(220, 'sawtooth', 0.2);
            setTimeout(() => setFlipped([]), 1000);
          }
        }
      };

      const currentQuizWord = activeUnitObj.words[quizIndex];

      if (!isRegistered) {
        return (
          <div className="max-w-md mx-auto mt-12 p-6 bg-white rounded-3xl shadow-xl border-4 border-pink-200 text-center">
            <h1 className="text-3xl font-black text-pink-500 mb-2">🎈 파닉스 플레이랜드</h1>
            <p className="text-gray-500 text-sm mb-6">학습을 시작할 학생 정보를 입력해주세요!</p>
            <form onSubmit={(e) => { 
              e.preventDefault(); 
              if(studentName.trim()) {
                setIsRegistered(true); 
                playSound('Welcome to Phonics Playland');
              }
            }} className="space-y-4">
              <div className="text-left">
                <label className="block text-sm font-bold text-gray-700 mb-1">어린이 이름</label>
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  placeholder="예: 홍길동"
                  className="w-full px-4 py-3 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-400 text-lg font-bold"
                />
              </div>
              <div className="text-left">
                <label className="block text-sm font-bold text-gray-700 mb-1">학년 선택</label>
                <select
                  value={grade}
                  onChange={(e) => setGrade(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-400 text-lg font-bold bg-white"
                >
                  <option value="초등 3학년 이상">🏫 초등 3학년 이상</option>
                  <option value="초등 1학년">🏫 초등 1학년</option>
                  <option value="초등 2학년">🏫 초등 2학년</option>
                  <option value="유치부">🧸 유치부</option>
                </select>
              </div>
              <button type="submit" className="w-full bg-pink-500 hover:bg-pink-600 text-white font-black py-4 rounded-2xl shadow-lg text-xl transition transform active:scale-95">
                학습 시작하기 🚀
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          <div className="bg-white rounded-2xl p-3 shadow-md border-2 border-pink-100 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <span className="text-2xl">👧</span>
              <div>
                <span className="text-xs text-pink-500 font-bold block">{grade}</span>
                <span className="text-lg font-black text-gray-800">{studentName}</span>
              </div>
            </div>
            <div className="flex items-center space-x-2">
              <div className="bg-amber-100 border border-amber-300 text-amber-700 font-black px-3 py-1 rounded-full text-sm flex items-center gap-1">
                ⭐ {score}점
              </div>
              <button onClick={() => setIsRegistered(false)} className="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-lg text-xs font-bold">
                👤 변경
              </button>
            </div>
          </div>

          <div className="grid grid-cols-4 gap-2">
            {UNITS.map((u, idx) => (
              <button
                key={u.id}
                onClick={() => { setCurrentUnit(idx); playSound(u.title); }}
                className={`p-2 rounded-2xl border-b-4 font-black transition flex flex-col items-center justify-center ${
                  currentUnit === idx ? 'bg-pink-500 text-white border-pink-700 shadow-lg scale-105' : 'bg-white text-gray-600 border-gray-200 hover:bg-pink-50'
                }`}
              >
                <span className="text-xl mb-1">{u.icon}</span>
                <span className="text-xs">U{idx + 1}</span>
              </button>
            ))}
          </div>

          <div className="bg-white rounded-2xl p-2 shadow-sm border border-pink-100 grid grid-cols-5 gap-1 text-center font-bold text-xs">
            {[
              { id: 'listen', label: '듣기', icon: '🎧' },
              { id: 'blend', label: '조합', icon: '🧩' },
              { id: 'match', label: '짝맞추기', icon: '🃏' },
              { id: 'spell', label: '스펠링', icon: '✏️' },
              { id: 'blank', label: '빈칸', icon: '🔍' },
            ].map((m) => (
              <button
                key={m.id}
                onClick={() => setCurrentMode(m.id)}
                className={`py-2 rounded-xl transition flex flex-col items-center justify-center ${
                  currentMode === m.id ? 'bg-pink-400 text-white shadow-md' : 'text-gray-500 hover:bg-pink-50'
                }`}
              >
                <span className="text-base">{m.icon}</span>
                <span>{m.label}</span>
              </button>
            ))}
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-lg border-4 border-pink-200 min-h-[380px] flex flex-col justify-between">
            {/* 1. 듣기 모드 */}
            {currentMode === 'listen' && (
              <div>
                <p className="text-xs font-bold text-pink-500 text-center mb-3">{activeUnitObj.title} • 그림 카드를 누르면 소리가 나요</p>
                {selectedWord && (
                  <div className="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200 text-center mb-4">
                    <div className="text-5xl mb-2">{selectedWord.icon}</div>
                    <div className="text-3xl font-black text-gray-800 tracking-wide mb-1">
                      <span className="text-pink-500">{selectedWord.sound}</span>
                      {selectedWord.word.slice(selectedWord.sound.length)}
                    </div>
                    <p className="text-sm font-bold text-gray-500 mb-2">"{selectedWord.meaning}"</p>
                    <button onClick={() => playSound(selectedWord.word)} className="bg-pink-400 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow active:scale-95">
                      🔊 크게 듣기
                    </button>
                  </div>
                )}
                <div className="grid grid-cols-3 gap-2">
                  {activeUnitObj.words.map((w, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setSelectedWord(w); playSound(w.word); }}
                      className={`p-2 rounded-xl border-2 text-center transition ${selectedWord?.word === w.word ? 'border-amber-400 bg-amber-100 shadow-md' : 'border-gray-100 bg-gray-50 hover:bg-pink-50'}`}
                    >
                      <div className="text-2xl mb-1">{w.icon}</div>
                      <div className="text-xs font-black text-gray-700">{w.word}</div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* 2. 소리 조합 게임 */}
            {currentMode === 'blend' && (
              <div className="text-center space-y-4">
                <span className="text-xs font-bold text-pink-500">알맞은 첫 소리(Blend)를 선택하세요! ({quizIndex + 1}/{activeUnitObj.words.length})</span>
                <div className="text-6xl">{currentQuizWord.icon}</div>
                <div className="text-3xl font-black text-gray-700">
                  <span className="text-pink-400 underline">? ?</span>{currentQuizWord.word.slice(currentQuizWord.sound.length)}
                </div>
                <p className="text-sm text-gray-500 font-bold">"{currentQuizWord.meaning}"</p>
                <div className="grid grid-cols-3 gap-2 pt-2">
                  {activeUnitObj.sounds.map((snd) => (
                    <button
                      key={snd}
                      onClick={() => {
                        if (snd === currentQuizWord.sound) {
                          setFeedback('⭕ 정답입니다!');
                          playSound(currentQuizWord.word);
                          addScorePoints(10, '조합 게임');
                          setTimeout(handleNextQuiz, 1200);
                        } else {
                          playBeep(200, 'sawtooth', 0.2);
                          setFeedback('❌ 다시 시도해보세요!');
                        }
                      }}
                      className="bg-pink-100 hover:bg-pink-200 text-pink-700 text-xl font-black py-3 rounded-xl border-2 border-pink-300"
                    >
                      {snd}
                    </button>
                  ))}
                </div>
                {feedback && <div className={`text-lg font-black ${feedback.includes('⭕') ? 'text-green-500' : 'text-red-500'}`}>{feedback}</div>}
              </div>
            )}

            {/* 3. 짝맞추기 메모리 게임 */}
            {currentMode === 'match' && (
              <div className="text-center space-y-3">
                <div className="flex justify-between items-center px-1">
                  <span className="text-xs font-bold text-pink-500">카드를 뒤집어 같은 그림과 단어를 맞추세요!</span>
                  <button onClick={initMatchGame} className="text-xs bg-pink-100 text-pink-600 font-bold px-2 py-1 rounded-lg">🔄 다시하기</button>
                </div>
                <div className="grid grid-cols-4 gap-2 pt-1">
                  {cards.map((card, idx) => {
                    const isFlipped = flipped.includes(idx) || matched.includes(idx);
                    return (
                      <button
                        key={idx}
                        onClick={() => handleCardClick(idx)}
                        className={`h-24 rounded-2xl border-2 flex flex-col items-center justify-center font-black transition-all transform active:scale-95 ${
                          isFlipped
                            ? 'bg-amber-50 border-amber-300 text-gray-800 shadow-md'
                            : 'bg-pink-400 border-pink-500 text-white text-3xl shadow'
                        }`}
                      >
                        {isFlipped ? (
                          card.type === 'icon' ? (
                            <span className="text-4xl">{card.val}</span>
                          ) : (
                            <span className="text-base font-black text-pink-600">{card.val}</span>
                          )
                        ) : (
                          '❓'
                        )}
                      </button>
                    );
                  })}
                </div>
                {feedback && (
                  <div className="text-lg font-black text-green-500 pt-2">{feedback}</div>
                )}
              </div>
            )}

            {/* 4. 스펠링 맞추기 */}
            {currentMode === 'spell' && (
              <div className="text-center space-y-4">
                <span className="text-xs font-bold text-pink-500">단어를 듣고 올바른 스펠링을 입력하세요!</span>
                <div className="text-6xl">{currentQuizWord.icon}</div>
                <button onClick={() => playSound(currentQuizWord.word)} className="bg-amber-400 text-white font-black px-4 py-1.5 rounded-full text-xs shadow">
                  🔊 소리 다시 듣기
                </button>
                <div>
                  <input
                    type="text"
                    value={userAnswer}
                    onChange={(e) => setUserAnswer(e.target.value.toLowerCase())}
                    placeholder="영어 단어 입력..."
                    className="w-full text-center text-2xl font-black p-3 border-2 border-pink-300 rounded-2xl focus:outline-none"
                  />
                </div>
                <button
                  onClick={() => {
                    if (userAnswer.trim() === currentQuizWord.word) {
                      setFeedback('🎉 정답입니다!');
                      addScorePoints(10, '스펠링 게임');
                      setTimeout(handleNextQuiz, 1200);
                    } else {
                      playBeep(200, 'sawtooth', 0.2);
                      setFeedback('❌ 다시 작성해보세요!');
                    }
                  }}
                  className="w-full bg-pink-500 text-white font-black py-3 rounded-2xl shadow"
                >
                  정답 확인하기
                </button>
                {feedback && <div className={`text-lg font-black ${feedback.includes('🎉') ? 'text-green-500' : 'text-red-500'}`}>{feedback}</div>}
              </div>
            )}

            {/* 5. 빈칸 채우기 (다양한 스펠링/모음 지원) */}
            {currentMode === 'blank' && (
              <div className="text-center space-y-4">
                <span className="text-xs font-bold text-pink-500">빈칸에 들어갈 올바른 스펠링을 맞혀보세요! ({quizIndex + 1}/{activeUnitObj.words.length})</span>
                <div className="text-6xl">{currentQuizWord.icon}</div>
                <div className="text-3xl font-black text-gray-800 tracking-wider">
                  {currentQuizWord.word.split('').map((char, index) => (
                    <span key={index}>
                      {index === blankInfo.targetIndex ? (
                        <span className="text-pink-500 underline mx-1">_</span>
                      ) : (
                        char
                      )}
                    </span>
                  ))}
                </div>
                <p className="text-sm font-bold text-gray-500">뜻: "{currentQuizWord.meaning}"</p>
                <div className="flex gap-3 justify-center pt-2">
                  {blankInfo.options.map((char, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        const correctChar = currentQuizWord.word[blankInfo.targetIndex];
                        if (char === correctChar) {
                          setFeedback('⭕ 정답입니다!');
                          playSound(currentQuizWord.word);
                          addScorePoints(10, '빈칸 게임');
                          setTimeout(handleNextQuiz, 1200);
                        } else {
                          playBeep(200, 'sawtooth', 0.2);
                          setFeedback('❌ 다시 시도해보세요');
                        }
                      }}
                      className="bg-amber-100 border-2 border-amber-300 text-amber-800 text-2xl font-black w-14 h-14 rounded-2xl shadow hover:bg-amber-200 active:scale-95 transition"
                    >
                      {char}
                    </button>
                  ))}
                </div>
                {feedback && <div className={`text-lg font-black ${feedback.includes('⭕') ? 'text-green-500' : 'text-red-500'}`}>{feedback}</div>}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
