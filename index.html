<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파닉스 키즈 플레이랜드 🎈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    // 선생님의 구글 앱스 스크립트 주소가 완전히 연결되었습니다!
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4LDDETD6E2gS8jxFHecFslZL2EQ6bco4rvxdPUPhasPhdtA_dSBpaUG6my5BZZpMM/exec";
  </script>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center p-4">
  <div id="root" class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-6 border-4 border-indigo-200"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [studentName, setStudentName] = useState('');
      const [grade, setGrade] = useState('초등 3학년');
      const [isRegistered, setIsRegistered] = useState(false);
      const [score, setScore] = useState(0);

      const handleStart = (e) => {
        e.preventDefault();
        if (!studentName.trim()) {
          alert('이름을 입력해주세요!');
          return;
        }
        setIsRegistered(true);
      };

      const sendResultToGoogleSheet = (unit, activity, scoreVal) => {
        const payload = {
          timestamp: new Date().toLocaleString('ko-KR'),
          grade: grade,
          studentName: studentName,
          unit: unit,
          activity: activity,
          score: scoreVal
        };

        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          alert('학습 결과가 선생님 구글 시트로 성공적으로 전송되었습니다! 🎉');
        }).catch((err) => {
          console.error('전송 실패:', err);
        });
      };

      const handleTestComplete = () => {
        const newScore = score + 100;
        setScore(newScore);
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        sendResultToGoogleSheet('Unit 1 (Blends)', '파닉스 퀴즈', 100);
      };

      return (
        <div className="text-center font-sans">
          {!isRegistered ? (
            <form onSubmit={handleStart} className="space-y-4">
              <h1 className="text-2xl font-bold text-indigo-600 mb-2">🎈 파닉스 키즈 플레이랜드</h1>
              <p className="text-gray-500 text-sm mb-4">학습을 시작하기 위해 프로필을 입력하세요!</p>
              
              <div className="text-left">
                <label className="block text-sm font-semibold text-gray-700 mb-1">학생 이름</label>
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  placeholder="예: 홍길동"
                  className="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-500 text-lg"
                />
              </div>

              <div className="text-left">
                <label className="block text-sm font-semibold text-gray-700 mb-1">학년 선택</label>
                <select
                  value={grade}
                  onChange={(e) => setGrade(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-500 text-lg bg-white"
                >
                  <option value="초등 3학년">🏫 초등 3학년</option>
                  <option value="초등 1학년">🏫 초등 1학년</option>
                  <option value="초등 2학년">🏫 초등 2학년</option>
                  <option value="유치부">🧸 유치부</option>
                </select>
              </div>

              <button
                type="submit"
                className="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 text-lg mt-4"
              >
                학습 시작하기 🚀
              </button>
            </form>
          ) : (
            <div className="space-y-4">
              <div className="bg-indigo-50 p-4 rounded-2xl flex justify-between items-center border border-indigo-100">
                <div className="text-left">
                  <span className="text-xs text-indigo-500 font-bold block">{grade}</span>
                  <span className="text-lg font-bold text-gray-800">{studentName} 어린이</span>
                </div>
                <div className="bg-amber-400 text-white font-black px-3 py-1 rounded-full text-sm">
                  ⭐ {score}점
                </div>
              </div>

              <div className="py-8 bg-indigo-100/50 rounded-2xl border-2 border-dashed border-indigo-200">
                <p className="text-xl font-bold text-indigo-700 mb-2">Unit 1: Blends (bl, cl, fl)</p>
                <p className="text-sm text-gray-600 mb-4">단어를 듣고 맞는 소리를 찾아보세요!</p>
                <button
                  onClick={handleTestComplete}
                  className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl shadow-md transition text-lg"
                >
                  퀴즈 풀고 점수 제출하기 📝
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
